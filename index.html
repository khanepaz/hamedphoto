<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>گالری تصاویر</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Tahoma, Arial, sans-serif;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        #status {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
        }

        .image-card {
            flex: 1 1 250px;
            max-width: 350px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        .image-card img {
            width: 100%;
            height: 250px;
            display: block;
            object-fit: cover;
        }

        .image-title {
            padding: 12px;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .image-card {
                flex: 1 1 100%;
                max-width: none;
            }
        }
    </style>
</head>

<body>

    <h1>گالری تصاویر</h1>

    <div id="status">
        در حال دریافت تصاویر...
    </div>

    <!--
        هیچ عکس ثابتی اینجا وجود ندارد.
        تصاویر توسط JavaScript از API دریافت می‌شوند.
    -->
    <div id="gallery" class="gallery"></div>


    <script>

        const gallery = document.getElementById("gallery");
        const status = document.getElementById("status");


        async function loadImages() {

            try {

                const response = await fetch(
                    "/.netlify/functions/images",
                    {
                        cache: "no-store"
                    }
                );


                if (!response.ok) {
                    throw new Error("خطا در دریافت تصاویر");
                }


                const data = await response.json();


                // API ما بعداً این ساختار را برمی‌گرداند:
                //
                // {
                //     "images": [
                //         {
                //             "id": "123",
                //             "url": "...",
                //             "title": "..."
                //         }
                //     ]
                // }

                const images = Array.isArray(data)
                    ? data
                    : (data.images || []);


                gallery.innerHTML = "";


                if (images.length === 0) {

                    status.textContent =
                        "هنوز تصویری در گالری وجود ندارد.";

                    return;
                }


                status.textContent =
                    `${images.length} تصویر`;


                images.forEach((item) => {

                    const card =
                        document.createElement("div");

                    card.className =
                        "image-card";


                    const img =
                        document.createElement("img");

                    img.src = item.url;

                    img.alt =
                        item.title || "تصویر";

                    img.loading = "lazy";

                    img.decoding = "async";


                    card.appendChild(img);


                    if (item.title) {

                        const title =
                            document.createElement("div");

                        title.className =
                            "image-title";

                        title.textContent =
                            item.title;

                        card.appendChild(title);
                    }


                    gallery.appendChild(card);

                });

            }

            catch (error) {

                console.error(error);

                status.textContent =
                    "فعلاً امکان دریافت تصاویر وجود ندارد.";

            }

        }


        // اولین بار هنگام باز شدن سایت
        loadImages();


        // هر 10 ثانیه بررسی می‌کنیم
        // که آیا تصویر جدیدی از تلگرام آمده یا نه.
        setInterval(loadImages, 10000);

    </script>

</body>
</html>
